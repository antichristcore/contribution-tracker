name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
    
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Docker build
      run: docker build -t github_contrib_tracker:$(git rev-parse --short HEAD) . && docker save github_contrib_tracker:$(git rev-parse --short HEAD)
